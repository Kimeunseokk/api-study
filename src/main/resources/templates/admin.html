<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageName}">관리자 페이지</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>관리자 페이지</h1>
        <a th:href="@{/home}" class="btn btn-back">홈으로</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>아이디</th>
            <th>이메일</th>
            <th>닉네임</th>
            <th>전화번호</th>
            <th>권한</th>
            <th>역할 변경</th>
            <th>삭제</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}" th:classappend="${user.email == currentEmail} ? 'current-user'">
            <td th:text="${user.id}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.nickname}"></td>
            <td th:text="${user.phone}"></td>
            <td>
                <span class="badge" th:classappend="${user.role.name() == 'ADMIN'} ? 'badge-admin' : 'badge-user'"
                      th:text="${user.role.description}"></span>
            </td>
            <td>
                <form th:action="|/admin/role/${user.id}|" method="post"
                      th:if="${user.email != currentEmail}">
                    <select name="role">
                        <option value="USER" th:selected="${user.role.name() == 'USER'}">일반 사용자</option>
                        <option value="ADMIN" th:selected="${user.role.name() == 'ADMIN'}">관리자</option>
                    </select>
                    <button type="submit" class="btn btn-change">변경</button>
                </form>
                <span th:if="${user.email == currentEmail}" class="self-label">본인</span>
            </td>
            <td>
                <form th:action="|/admin/delete/${user.id}|" method="post"
                      th:if="${user.email != currentEmail}"
                      onsubmit="return confirm('정말 삭제하시겠습니까?')">
                    <button type="submit" class="btn btn-delete">삭제</button>
                </form>
                <span th:if="${user.email == currentEmail}">-</span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
